apiVersion: v1
kind: Pod
metadata:
  name: kafka-consumer
  labels:
    app: kafka-consumer
spec:
  serviceAccountName: kcd-port-demo
  automountServiceAccountToken: false
  restartPolicy: Always
  containers:
    - name: consumer
      image: antdev9/kafka-app-demo:consumer
      imagePullPolicy: Always
      command: ["/consumer"]
      envFrom:
        - configMapRef:
            name: kafka-app-config
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 256Mi
