apiVersion: v1
kind: Pod
metadata:
  name: kafka-producer
  labels:
    app: kafka-producer
spec:
  serviceAccountName: kcd-port-demo
  automountServiceAccountToken: false
  restartPolicy: Always
  containers:
    - name: producer
      image: antdev9/kafka-app-demo:producer
      imagePullPolicy: Always
      command: ["/producer"]
      args:
        - "-data=/data/transactions.json"
      envFrom:
        - configMapRef:
            name: kafka-app-config
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 256Mi
