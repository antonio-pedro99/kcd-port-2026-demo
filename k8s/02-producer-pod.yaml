apiVersion: v1
kind: Pod
metadata:
  name: kafka-producer
  labels:
    app: kafka-producer
spec:
  serviceAccountName: kcd-port-demo
  automountServiceAccountToken: false
  restartPolicy: Always
  containers:
    - name: producer
      image: kcd-producer:latest
      # Local/lab images: do not pull from a registry.
      imagePullPolicy: Never
      env:
        # Point at your Kafka bootstrap servers (deployed separately).
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        - name: KAFKA_TOPICS
          value: "payments,transfers,cards"
        - name: KAFKA_RATE
          value: "5000"
        - name: DATA_PATH
          value: "/data/transactions.json"
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 256Mi
