apiVersion: v1
kind: Pod
metadata:
  name: kafka-consumer
  labels:
    app: kafka-consumer
spec:
  serviceAccountName: kcd-port-demo
  automountServiceAccountToken: false
  restartPolicy: Always
  containers:
    - name: consumer
      image: kcd-consumer:latest
      # Local/lab images: do not pull from a registry.
      imagePullPolicy: Never
      env:
        # Point at your Kafka bootstrap servers (deployed separately).
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        - name: KAFKA_TOPICS
          value: "payments,transfers,cards"
        - name: KAFKA_GROUP
          value: "risk-alerts"
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 256Mi
